<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mineshaft</title>
    <meta
      name="description"
      content="A mining game played on a Minesweeper board: walk the cave, dig the rock, mark what you do not trust."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  </head>
  <body class="mine">
    <h1>Mineshaft</h1>

    <div class="frame">
      <div class="hud mine-hud">
        <div id="position" aria-live="polite" aria-label="Position">&mdash;</div>
        <div class="mine-digs">digs <span id="digs">0</span></div>
        <button id="new-cave" type="button">New cave</button>
      </div>
      <div id="board" role="grid" aria-label="Cave"></div>
    </div>

    <div class="controls">
      <button id="mark-mode" type="button" aria-pressed="false">
        <span class="flag-icon" aria-hidden="true"></span>
        Mark mode
      </button>
      <label for="cave">Cave</label>
      <select id="cave">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>
    </div>

    <div class="pad" role="group" aria-label="Move">
      <button id="pad-north" type="button" aria-label="North">&#9650;</button>
      <button id="pad-west" type="button" aria-label="West">&#9664;</button>
      <button id="pad-east" type="button" aria-label="East">&#9654;</button>
      <button id="pad-south" type="button" aria-label="South">&#9660;</button>
    </div>

    <p id="status" role="status"></p>
    <p class="hint" id="hint"></p>
    <p class="elsewhere">
      <a href="../">Classic Minesweeper &rarr;</a>
      &nbsp;&middot;&nbsp;
      <a href="../shapes/">Hexagons and triangles &rarr;</a>
    </p>

    <footer>
      Walk into rock and you dig it; walk into open cave and you move. The
      numbers mean what they mean in
      <a href="../">Minesweeper</a> &mdash; same board, same rules, but you
      only reach the four tiles around you. Art credited in the
      <a href="https://github.com/zacharysnewman/minesweeper-console-typescript"
        >repository README</a
      >.
    </footer>

    <!--
      The module is hashed, so it can never be stale. index.html is not, and
      a browser holding an old copy of this file asks for a script hash that
      no longer exists -- which renders as a styled page with no board and no
      explanation. This watchdog is plain, non-module script so it runs even
      when the module does not, and it says what happened.
    -->
    <script>
      (function () {
        function show(text) {
          if (window.pageBooted) return;
          var status = document.getElementById("status");
          if (!status || status.dataset.bootFailed) return;
          status.dataset.bootFailed = "1";
          status.textContent = text;
          var again = document.createElement("button");
          again.type = "button";
          again.textContent = "Reload";
          again.style.marginInlineStart = "8px";
          again.addEventListener("click", function () {
            // A fresh query string, so the retry cannot be answered from
            // whatever cached or half-deployed copy caused this.
            location.replace(location.pathname + "?v=" + Date.now());
          });
          status.appendChild(again);
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT") {
              // The file never arrived: a 404, a blocked request, or an
              // index.html pointing at a build that is no longer there.
              var src = String(target.src || "").split("/").pop();
              show("Could not load the script (" + src + ").");
              return;
            }
            // It arrived and threw. An error while the modules are still
            // being evaluated lands here rather than in the page's own
            // try/catch, which has not started yet.
            if (event.message) {
              show("The script failed: " + event.message);
            }
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            show("The script loaded but never ran.");
          }, 2500);
        });
      })();
    </script>
    <script type="module" src="/src/web/mine.ts"></script>
  </body>
</html>
