
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper</title>
    <meta
      name="description"
      content="A browser build of a TypeScript Minesweeper, sharing its game logic with the original console version."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  </head>
  <body>
    <h1>Minesweeper</h1>

    <div class="frame">
      <div class="hud">
        <div id="counter" aria-live="polite" aria-label="Mines remaining">000</div>
        <button id="smiley" type="button" aria-label="New game"></button>
        <div class="hud-spacer" aria-hidden="true"></div>
      </div>
      <div id="board" role="grid" aria-label="Minefield"></div>
    </div>

    <div class="controls">
      <button id="flag-mode" type="button" aria-pressed="false">
        <span class="flag-icon" aria-hidden="true"></span>
        Flag mode
      </button>
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="expert">Expert</option>
      </select>
    </div>

    <p id="status" role="status"></p>
    <p class="hint" id="hint"></p>
    <p class="elsewhere">
      <a href="mine/">Play the mining game &rarr;</a>
      &nbsp;&middot;&nbsp;
      <a href="shapes/">Hexagons and triangles &rarr;</a>
    </p>

    <footer>
      Game logic shared with the
      <a href="https://github.com/zacharysnewman/minesweeper-console-typescript"
        >console version</a
      >. Tile and smiley art and the digital counter font come from the
      <a href="https://github.com/zacharysnewman/minesweeper-unity-csharp"
        >Unity build</a
      >; see the repository README for attribution.
    </footer>

    <!--
      The module is hashed, so it can never be stale. index.html is not, and
      a browser holding an old copy of this file asks for a script hash that
      no longer exists -- which renders as a styled page with no board and no
      explanation. This watchdog is plain, non-module script so it runs even
      when the module does not, and it says what happened.
    -->
    <script>
      (function () {
        function show(text) {
          if (window.pageBooted) return;
          var status = document.getElementById("status");
          if (!status || status.dataset.bootFailed) return;
          status.dataset.bootFailed = "1";
          status.textContent = text;
          var again = document.createElement("button");
          again.type = "button";
          again.textContent = "Reload";
          again.style.marginInlineStart = "8px";
          again.addEventListener("click", function () {
            // A fresh query string, so the retry cannot be answered from
            // whatever cached or half-deployed copy caused this.
            location.replace(location.pathname + "?v=" + Date.now());
          });
          status.appendChild(again);
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT") {
              // The file never arrived: a 404, a blocked request, or an
              // index.html pointing at a build that is no longer there.
              var src = String(target.src || "").split("/").pop();
              show("Could not load the script (" + src + ").");
              return;
            }
            // It arrived and threw. An error while the modules are still
            // being evaluated lands here rather than in the page's own
            // try/catch, which has not started yet.
            if (event.message) {
              show("The script failed: " + event.message);
            }
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () {
            show("The script loaded but never ran.");
          }, 2500);
        });
      })();
    </script>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
